# The plugin repo's own CI: every gate that does not need a provisioned Hermes runtime.
#
# Every action below is pinned to a full commit SHA instead of a floating major tag, and that pin is what
# keeps this workflow reproducible: `v4` is a moving ref its maintainer can re-point, a SHA cannot be, so a
# green run today means the same code was green yesterday.
name: validate

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Hermes checkout for the plugin surface
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      # This plugin declares no Python dependencies (spec §4.8), so the four packages below are the host's
      # own: pytest to run the suite, and fastapi / httpx / ruamel.yaml because `dashboard/plugin_api.py`
      # builds a real APIRouter and the config reader parses the manifest with the loader Hermes uses.
      # No number here: the suite prints its own count on every push, and a figure copied into this comment
      # goes stale on the first test added and reads as a defect in the runner.
      - name: Python dependencies
        run: python -m pip install --no-input pytest fastapi httpx ruamel.yaml

      # The JS half runs first, and not by taste: `tests/render_plugin.mjs` writes tests/page-under-test.mjs,
      # which is a copy of the page carrying the same version claim as `plugin.yaml`, and the Python identity
      # gate names that copy among the files whose version has to equal the released one. Running pytest on a
      # fresh checkout -- where the copy is gitignored and does not exist yet -- would fail on the absence of
      # a generated file rather than on anything the contributor wrote.
      - name: React for the render harness
        # The JS gates borrow React from `$HERMES_AGENT_DIR/node_modules` (tests/render_plugin.mjs), which a
        # `--depth 1` clone does not carry. Installed in a scratch dir and linked in, because `npm install` at
        # the clone root would resolve hermes-agent's whole npm workspace (Electron and all) for two packages.
        run: |
          mkdir -p "$RUNNER_TEMP/jsdeps"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/jsdeps" react@19 react-dom@19
          ln -s "$RUNNER_TEMP/jsdeps/node_modules" "$RUNNER_TEMP/hermes-agent/node_modules"

      - name: JS gates
        env:
          HERMES_AGENT_DIR: ${{ runner.temp }}/hermes-agent
        # Order is load-bearing: the harness writes tests/page-under-test.mjs, the literal gate refuses to
        # run against a copy older than the page, and ui_units and the two node --test files import that
        # copy. `node --test tests` is not a thing on Node 22 -- a bare directory is resolved as a module
        # and no test file matches -- so the files are listed (here by glob, which the shell expands).
        run: |
          node tests/render_plugin.mjs
          node tools/no_literal.mjs
          node tests/ui_units.mjs
          node --test tests/*.test.mjs

      - name: Python gates
        # `runner.temp` is the context form of the `$RUNNER_TEMP` the clone above wrote into; the `env`
        # context has no `RUNNER_TEMP` key, so writing `${{ env.RUNNER_TEMP }}` here would pass an empty
        # string and every reader would fall back to a path that does not exist.
        env:
          HERMES_AGENT_DIR: ${{ runner.temp }}/hermes-agent
        run: python -m pytest tests -q

      - name: Secret and PII scans
        # Last, so the generated page copy is on disk and gets scanned with everything else the push
        # publishes: it is a copy of `desktop/plugin.js`, so nothing new can be found, and a scan that ran
        # before the harness would simply not look at it.
        run: python tools/scan_secrets.py && python tools/scan_pii.py .

# `hermes plugins validate .` is deliberately NOT a step here: it needs a provisioned Hermes environment,
# and a plugin repo must not install one in CI. The catalog's own CI runs it against the commit you pin,
# so it stays the documented local pre-push step (README, "Tests").
